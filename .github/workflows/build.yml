name: Android APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Java 21 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK Kurulumu
        uses: android-actions/setup-android@v3

      - name: Keystore Hazırla
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Gradle 9.3.1 Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: APK Oluştur
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: gradle :app:assembleDebug --no-daemon

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: yCloud-APK
          path: app/build/outputs/apk/debug/*.apk
